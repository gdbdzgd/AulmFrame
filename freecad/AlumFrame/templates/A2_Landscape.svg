<?xml version="1.0" encoding="UTF-8"?>
<svg id="alumframe_a2" width="594mm" height="420mm" viewBox="0 0 594 420"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:freecad="https://www.freecad.org/wiki/index.php?title=Svg_Namespace">
  <!-- Sheet border -->
  <g fill="none" stroke="#000000" stroke-width="0.7">
    <rect x="10" y="10" width="574" height="400"/>
    <rect x="20" y="20" width="554" height="380"/>
  </g>
  <!-- Title block (bottom-right) -->
  <g fill="none" stroke="#000000" stroke-width="0.5">
    <rect id="titleblock" x="380" y="310" width="194" height="90"/>
    <line x1="380" y1="340" x2="574" y2="340"/>
    <line x1="380" y1="360" x2="574" y2="360"/>
    <line x1="380" y1="382" x2="574" y2="382"/>
    <line x1="466" y1="340" x2="466" y2="360"/>
    <line x1="520" y1="340" x2="520" y2="360"/>
  </g>
  <g font-family="osifont, sans-serif" font-size="5" fill="#000000">
    <text x="386" y="333">铝型材加工图纸</text>

    <!-- row: 规格 / 比例 / 图号 -->
    <text x="384" y="353">规格:</text>
    <text x="414" y="353" freecad:editable="spec">spec</text>
    <text x="470" y="353">比例:</text>
    <text x="500" y="353" freecad:editable="scale">scale</text>
    <text x="524" y="353">图号:</text>
    <text x="552" y="353" freecad:editable="sheet">sheet</text>

    <!-- row: 材料 (full width) -->
    <text x="384" y="374">材料:</text>
    <text x="414" y="374" freecad:editable="material">material</text>

    <!-- row: 连接方式 (full width) -->
    <text x="384" y="396">连接:</text>
    <text x="414" y="396" freecad:editable="note">note</text>
  </g>
</svg>
